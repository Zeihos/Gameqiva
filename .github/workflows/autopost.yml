name: GAMEQIVA Auto Publish
on:
  schedule:
    # Hourly at minute 17 UTC (minute 17 in Krasnoyarsk, UTC+7).
    # Avoid the busiest top-of-hour GitHub Actions scheduling window.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to VK and Telegram? Disable to preview post in workflow logs.'
        required: true
        type: boolean
        default: false
      preview_hours:
        description: 'Only for publish=false: check 24h or 72h of official news to test generation without posting.'
        type: choice
        options:
          - '24'
          - '72'
        default: '24'
concurrency:
  group: gameqiva-autopost
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify Python syntax
        run: |
          python -m compileall -q run.py sources.py editorial.py feed_health.py rss_collector.py test_editorial.py test_editorial_safety.py test_rss_collector.py test_feed_health.py test_vk_publishing.py
          python -m unittest -q test_editorial test_editorial_safety test_rss_collector test_feed_health test_vk_publishing
      - name: Publish one verified news item
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          # Optional real user token for uploading photos to the community wall.
          VK_PHOTO_USER_TOKEN: ${{ secrets.VK_PHOTO_USER_TOKEN }}
          VK_GROUP_SCREEN_NAME: gameqiva
          # Optional repo variable with numeric group ID: blank = resolve from screen name.
          VK_GROUP_ID: ${{ vars.VK_GROUP_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: '@gameqivo'
          # Scheduled runs publish; manual runs preview by default.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != true && '1' || '0' }}
          PREVIEW_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != true && inputs.preview_hours || '24' }}
        run: python run.py
      - name: Save publication state across runs
        if: always() && (github.event_name == 'schedule' || inputs.publish == true)
        run: |
          git config user.name 'gameqiva-autopost[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update GAMEQIVA publication state [skip ci]'
            # A push can race with a documentation change or another commit.
            # Replay the state commit on top of main, never force-push.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main || exit 1
              sleep 3
            done
            echo 'Failed to persist publication state after three attempts' >&2
            exit 1
          fi
