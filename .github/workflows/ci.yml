name: Проверка кода

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 · тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Проверить синтаксис
        run: python -m compileall -q run.py sources.py editorial.py feed_health.py rss_collector.py test_editorial.py test_editorial_safety.py test_rss_collector.py test_feed_health.py test_vk_publishing.py
      - name: Запустить тесты
        run: python -m unittest -q test_editorial test_editorial_safety test_rss_collector test_feed_health test_vk_publishing
